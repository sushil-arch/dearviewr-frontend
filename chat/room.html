<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Chat Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>
body{
margin:0;
font-family:system-ui;
background:#0b0b0b;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
}

header{
padding:14px;
background:#121212;
border-bottom:1px solid #222;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:10px 14px;
border-radius:14px;
max-width:70%;
}

.me{
align-self:flex-end;
background:linear-gradient(45deg,#ff0050,#ff4080);
}

.other{
align-self:flex-start;
background:#1f1f1f;
}

#inputArea{
display:flex;
padding:10px;
border-top:1px solid #222;
}

#msg{
flex:1;
padding:10px;
border:none;
border-radius:8px;
background:#1a1a1a;
color:#fff;
}

#send{
margin-left:10px;
padding:10px 15px;
border:none;
background:#ff0050;
color:#fff;
border-radius:8px;
}
</style></head><body><header id="username">Chat</header><div id="chat"></div><div id="inputArea">
<input id="msg" placeholder="Type message...">
<button id="send">Send</button>
</div><script>

const params = new URLSearchParams(window.location.search)

const receiver = params.get("user")
const name = params.get("name")

document.getElementById("username").innerText=name

const token = localStorage.getItem("token")

const socket = new WebSocket(`wss://dearviewr.in/api/ws/chat?token=${token}`)

const chat = document.getElementById("chat")

function addMessage(text,type){

const div=document.createElement("div")
div.className="msg "+type
div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

document.getElementById("send").onclick=send

document.getElementById("msg").addEventListener("keypress",e=>{
if(e.key==="Enter") send()
})

function send(){

const text=document.getElementById("msg").value

socket.send(JSON.stringify({
to:receiver,
message:text
}))

addMessage(text,"me")

document.getElementById("msg").value=""

}

socket.onmessage=(event)=>{

const data=JSON.parse(event.data)

addMessage(data.message,"other")

}

</script></body>
</html>
