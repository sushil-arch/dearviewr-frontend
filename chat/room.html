<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chat Room</title><style>

body{
margin:0;
font-family:system-ui;
background:#000;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
height:60px;
display:flex;
align-items:center;
padding:0 15px;
border-bottom:1px solid #222;
}

.messages{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
margin:8px 0;
}

.me{
text-align:right;
}

.bubble{
display:inline-block;
padding:10px;
border-radius:10px;
background:#222;
max-width:70%;
}

.me .bubble{
background:#ff0050;
}

.input{
display:flex;
padding:10px;
border-top:1px solid #222;
}

.input input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
background:#111;
color:#fff;
}

.input button{
margin-left:8px;
padding:10px 15px;
background:#ff0050;
border:none;
color:#fff;
border-radius:8px;
}

</style></head><body><div class="header">Chat

</div><div class="messages" id="messages"></div><div class="input"><input id="msgInput" placeholder="Type message"><button onclick="send()">Send</button>

</div><script>

let socket

function connect(){

const token=localStorage.getItem("access_token")

socket=new WebSocket("wss://dearviewr.in/api/ws/chat?token="+token)

socket.onmessage=(event)=>{

const data=JSON.parse(event.data)

addMessage(data.message,false)

}

}

function send(){

const input=document.getElementById("msgInput")

if(!input.value) return

socket.send(JSON.stringify({

to:1,
message:input.value

}))

addMessage(input.value,true)

input.value=""

}

function addMessage(msg,me){

const div=document.createElement("div")

div.className="msg "+(me?"me":"")

div.innerHTML=`<div class="bubble">${msg}</div>`

document.getElementById("messages").appendChild(div)

}

connect()

</script></body></html>
