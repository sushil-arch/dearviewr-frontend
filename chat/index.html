<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Chat | DearViewr</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#000;
color:#fff;
}

.header{
height:60px;
display:flex;
align-items:center;
padding:0 15px;
border-bottom:1px solid #222;
font-size:18px;
font-weight:bold;
}

.search{
padding:10px;
border-bottom:1px solid #222;
}

.search input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
background:#111;
color:#fff;
}

.chat-list{
overflow-y:auto;
height:calc(100vh - 110px);
}

.chat-item{
display:flex;
align-items:center;
padding:12px;
border-bottom:1px solid #111;
cursor:pointer;
}

.chat-item:hover{
background:#111;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#444;
margin-right:12px;
}

.chat-info{
flex:1;
}

.username{
font-weight:bold;
}

.last-msg{
font-size:13px;
opacity:.7;
}

</style>

</head>

<body>

<div class="header">
Chat
</div>

<div class="search">
<input type="text" placeholder="Search users">
</div>

<div class="chat-list" id="chatList">

<div style="padding:20px;text-align:center;">
Loading users...
</div>

</div>

<script>

const API_BASE="https://dearviewr.in/api"

async function loadUsers(){

const token=localStorage.getItem("access_token")

if(!token){

window.location.href="/auth/login.html"

return

}

try{

const res=await fetch(API_BASE+"/chat/users",{

headers:{
Authorization:"Bearer "+token
}

})

const users=await res.json()

const list=document.getElementById("chatList")

list.innerHTML=""

users.forEach(u=>{

const div=document.createElement("div")

div.className="chat-item"

div.onclick=()=>openChat(u.id)

div.innerHTML=`

<div class="avatar"></div>

<div class="chat-info">

<div class="username">@${u.username}</div>

<div class="last-msg">Start conversation</div>

</div>
`

list.appendChild(div)

})

}catch(err){

console.error(err)

}

}

function openChat(userId){

window.location.href="/chat/room.html?user="+userId

}

loadUsers()

</script>

</body>
</html>
