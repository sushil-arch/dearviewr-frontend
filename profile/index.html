<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Profile</title><style>

body{
background:#000;
color:#fff;
font-family:system-ui;
margin:0;
padding:20px;
text-align:center;
}

.profile-card{
max-width:420px;
margin:auto;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
background:#111;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:40px;
}

.username{
font-size:22px;
margin-top:10px;
}

.bio{
font-size:14px;
opacity:0.8;
margin-bottom:15px;
}

.stats{
display:flex;
justify-content:center;
gap:30px;
margin-bottom:20px;
}

.stat{
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.edit{
background:linear-gradient(45deg,#ff0050,#00f2ea);
color:#fff;
}

.creator{
background:#222;
color:#fff;
}

.follow{
background:#00f2ea;
color:#000;
}

.message{
background:#ff0050;
color:#fff;
}

.logout{
background:#111;
color:#ff4444;
}

</style></head><body><div class="profile-card"><div class="avatar">👤</div><div id="username" class="username">Loading...</div><div id="bio" class="bio">Loading bio...</div><div class="stats"><div class="stat">
<div id="videoCount">0</div>
<div>Videos</div>
</div><div class="stat">
<div id="viewCount">0</div>
<div>Views</div>
</div></div><button class="edit" onclick="editProfile()">✏ Edit Profile</button>

<button class="creator" onclick="becomeCreator()">🎬 Become Creator</button>

<button class="follow" onclick="followUser()">👤 Follow</button>

<button class="message" onclick="messageUser()">💬 Message</button>

<button class="logout" onclick="logout()">🚪 Logout</button>

</div><script>

const API_BASE = "/api"


async function loadProfile(){

const token = localStorage.getItem("access_token")

if(!token){
window.location.href="/auth/login.html"
return
}

try{

const res = await fetch(API_BASE + "/profile",{
headers:{
Authorization:"Bearer " + token
}
})

const data = await res.json()

document.getElementById("username").innerText = data.username || "User"

document.getElementById("bio").innerText = data.bio || "No bio yet"

document.getElementById("videoCount").innerText = data.total_videos || 0

document.getElementById("viewCount").innerText = data.total_views || 0

}catch(err){

console.error("Profile load failed",err)

}

}


function editProfile(){
window.location.href="/profile/edit.html"
}


function becomeCreator(){
window.location.href="/creator/dashboard.html"
}


async function followUser(){

const token = localStorage.getItem("access_token")

if(!token){
window.location.href="/auth/login.html"
return
}

const params = new URLSearchParams(window.location.search)

const userId = params.get("user")

if(!userId){
alert("User not found")
return
}

await fetch("/api/follow/"+userId,{
method:"POST",
headers:{
Authorization:"Bearer "+token
}
})

alert("Followed successfully")

}


function messageUser(){

const params = new URLSearchParams(window.location.search)

const userId = params.get("user")

if(!userId){
alert("User not found")
return
}

window.location.href="/chat/room.html?user="+userId

}


function logout(){

localStorage.removeItem("access_token")

window.location.href="/auth/login.html"

}


loadProfile()

</script></body>
</html>
