<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chat | DearViewr</title><style>

body{
margin:0;
font-family:system-ui;
background:#000;
color:#fff;
}

.header{
height:60px;
display:flex;
align-items:center;
padding:0 15px;
border-bottom:1px solid #222;
font-size:18px;
font-weight:bold;
}

.search{
padding:10px;
border-bottom:1px solid #222;
}

.search input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
background:#111;
color:#fff;
}

.chat-list{
overflow-y:auto;
height:calc(100vh - 110px);
}

.chat-item{
display:flex;
align-items:center;
padding:12px;
border-bottom:1px solid #111;
cursor:pointer;
}

.chat-item:hover{
background:#111;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#444;
margin-right:12px;
}

.chat-info{
flex:1;
}

.username{
font-weight:bold;
}

.last-msg{
font-size:13px;
opacity:.7;
}

</style></head><body><div class="header">Chat

</div><div class="search"><input type="text" placeholder="Search users"></div><div class="chat-list" id="chatList"><div class="chat-item" onclick="openChat(1)"><div class="avatar"></div><div class="chat-info"><div class="username">Creator</div><div class="last-msg">Hello</div></div></div></div><script>

function openChat(userId){

window.location.href="/chat/room.html?user="+userId

}

</script></body></html>
